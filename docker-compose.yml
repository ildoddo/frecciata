# Postgres locale in sviluppo: docker compose up -d
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: frecciata
    ports:
      - "5432:5432"
    volumes:
      - frecciata_pgdata:/var/lib/postgresql/data

volumes:
  frecciata_pgdata:
